name: Build image on PR

on:
  pull_request:
  merge_group:

jobs:
  build-on-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker buildx build --cache-to type=gha,mode=max --cache-from type=gha .

